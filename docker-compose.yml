name: chord

services:
  server:
    build:
      context: ./server
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: chord-server
    container_name: chord-server
    environment:
      DEVICE: ${DEVICE:-cpu}
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-24}
    volumes:
      - ./server/data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: chord-web
    container_name: chord-web
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped
