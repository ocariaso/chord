server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app shell and the API's JSON compress well. Stems and artwork are already compressed, and the event
    # stream is left out so each update goes out as soon as it's written.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # A twelve-minute lossless upload runs to hundreds of MB; nginx's 1 MB default rejects it.
        client_max_body_size 512m;

        proxy_pass http://server:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
    }

    # Vite puts a content hash in every file name under /assets/, so a file there never changes under its name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current hashed assets, so it must be revalidated on every load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
